<!doctype html><html><body style="margin:0;background:#000"><canvas id="c"></canvas><script>
const Wd=+new URLSearchParams(location.search).get('w')||960, Ht=Math.round(Wd*9/16);
const cv=document.getElementById('c'); cv.width=Wd; cv.height=Ht;
const gl=cv.getContext('webgl2',{preserveDrawingBuffer:true,antialias:false});
const ext=gl.getExtension('EXT_color_buffer_float'); gl.getExtension('OES_texture_float_linear');
const VS=`#version 300 es
in vec2 p; out vec2 uv; void main(){uv=p*.5+.5; gl_Position=vec4(p,0,1);}`;
const FS1=`#version 300 es
precision highp float; in vec2 uv; out vec4 o;
uniform vec2 res; uniform vec4 CA[40]; uniform vec4 CB[40]; uniform vec4 FIG[3]; uniform vec4 HEAD[3]; uniform vec4 HP[3]; uniform vec3 TC[3];
const int NC=11;
float sdCap(vec3 p, vec3 a, vec3 b, float r){vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-r;}
float sdEll(vec3 p, vec3 r){float k0=length(p/r), k1=length(p/(r*r)); return k0*(k0-1.)/k1;}
vec2 mn(vec2 a, vec2 b){return a.x<b.x?a:b;}
vec2 map(vec3 p){
  vec2 r=vec2(p.y,0.);
  r=mn(r,vec2(p.z+7.,5.));

  float dp=sdCap(p,vec3(.95,-1.,4.6),vec3(.95,6.,4.6),.13); r=mn(r,vec2(dp,6.));
  for(int i=0;i<3;i++){
    float bd=length(p-FIG[i].xyz)-FIG[i].w;
    if(bd>.3){ r.x=min(r.x,bd); continue; }
    for(int j=0;j<NC;j++){
      int k=i*NC+j; float d=sdCap(p,CA[k].xyz,CB[k].xyz,CA[k].w);
      r=mn(r,vec2(d,float(i)*10.+CB[k].w));

    float d=sdEll(q,vec3(.40,.50,.40)*HP[i].x);
    r=mn(r,vec2(d,float(i)*10.+1.));
  }

}
vec3 nrm(vec3 p){vec2 e=vec2(.0015,0); return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x));}
float shadow(vec3 ro, vec3 rd){float res=1.,t=.03; for(int i=0;i<40;i++){float h=map(ro+rd*t).x; res=min(res,9.*h/t); t+=clamp(h,.02,.4); if(res<.003||t>9.) break;} return clamp(res,0.,1.);}
float ao(vec3 p, vec3 n){float o=0.,s=1.; for(int i=1;i<=5;i++){float h=.04*float(i); o+=(h-map(p+n*h).x)*s; s*=.7;} return clamp(1.-1.6*o,0.,1.);}
vec3 headTex(int fig, vec3 p, vec3 base){
  vec3 q=p-HEAD[fig].xyz; float c=cos(HEAD[fig].w), s=sin(HEAD[fig].w); q.xy=mat2(c,-s,s,c)*q.xy;
  vec3 n=normalize(q/ (vec3(.40,.50,.40)*HP[fig].x)); float em=HP[fig].y;
  if(n.z<.35) return base;
  vec2 f=n.xy; float w=0.;
  vec2 e1=(f-vec2(-.30,.10))/vec2(.11,.19), e2=(f-vec2(.30,.10))/vec2(.11,.19);
  if(dot(e1,e1)<1.||dot(e2,e2)<1.) w=1.;
  if(em<.5){ vec2 m=(f-vec2(0.,-.40))/vec2(.17,.045); float ring=abs(length(m)-1.); if(f.y<-.34 && ring<.35) w=1.; }
  else if(em<1.5){ vec2 m=(f-vec2(0.,-.42))/vec2(.09,.13); if(dot(m,m)<1.) w=1.;
    // brows slanted down inwards
    float b1=abs((f.y-.34)-(-(f.x+.30)*.5+0.)); if(abs(f.x+.30)<.17 && abs(f.y-.30+(f.x+.30)*-.7)<.035) w=1.;
    if(abs(f.x-.30)<.17 && abs(f.y-.30-(f.x-.30)*-.7)<.035) w=1.; }
  else { vec2 m=(f-vec2(0.,-.42))/vec2(.11,.16); if(dot(m,m)<1.) w=1.;
    if(abs(f.x+.30)<.15 && abs(f.y-.38-(.10-abs(f.x+.30))*.0)<.03) w=1.;
    if(abs(f.x-.30)<.15 && abs(f.y-.38)<.03) w=1.; }

void main(){
  vec2 q=(uv-.5)*vec2(res.x/res.y,1.)*2.;
  vec3 ro=vec3(0.,.95,6.0), ta=vec3(.35,1.2,0.);
  vec3 ww=normalize(ta-ro), uu=normalize(cross(ww,vec3(0,1,0))), vv=cross(uu,ww);
  float fl=tan(radians(31.)/2.);
  vec3 rd=normalize(ww+ (q.x*uu+q.y*vv)*fl*1.);

  for(int i=0;i<110;i++){h=map(ro+rd*t); if(h.x<.0008*t){hit=true;break;} t+=h.x*.9; if(t>45.) break;}
  vec3 col; 
  vec3 L1=normalize(vec3(.55,.55,-.6)), L2=normalize(vec3(-.65,.35,.7));
  vec3 K1=vec3(1.0,.72,.45)*2.4, K2=vec3(.35,.45,.95)*.85;
  if(hit){
    vec3 p=ro+rd*t, n=nrm(p); int m=int(h.y+.5); int fig=m/10; int part=m-fig*10;
    vec3 base=vec3(.02); float gloss=60., spec=1.; float rim=1.;
    if(m==0){ base=vec3(.045,.028,.05); gloss=14.; spec=.1; vec2 fp=p.xz; base*=mix(.5,1.,smoothstep(7.,-1.,length(fp-vec2(2.,-3.)))); base+=vec3(.5,.28,.12)*exp(-.12*length(p.xz-vec2(2.4,-5.5)))*.55; }
    else if(m==5){ base=mix(vec3(.17,.10,.22),vec3(.30,.19,.30),smoothstep(0.,4.,p.y)); gloss=8.; spec=.1; rim=0.; }
    else if(m==6){ base=vec3(.30,.18,.10)*(.8+.2*sin(p.y*40.)); gloss=10.; spec=.2; rim=.2; }
    else if(part==1){ base=headTex(fig,p,vec3(.015,.015,.02)); gloss=80.; spec=1.4; }
    else if(part==2){ base=TC[fig]; gloss=14.; spec=.35; }
    else { base=vec3(.02,.02,.025); gloss=40.; spec=.8; }
    float a=ao(p,n);
    float s1=shadow(p+n*.02,L1), s2=.55+.45*shadow(p+n*.02,L2);
    vec3 v=-rd;
    float d1=max(dot(n,L1),0.), d2=max(dot(n,L2),0.);
    vec3 H1=normalize(L1+v), H2=normalize(L2+v);
    float sp1=pow(max(dot(n,H1),0.),gloss)*spec, sp2=pow(max(dot(n,H2),0.),gloss)*spec;
    col=base*(K1*d1*s1+K2*d2*s2+vec3(.20,.14,.26)*a*(.6+.4*n.y));
    col+=K1*sp1*s1*(m==0?.3:1.)+K2*sp2*s2;
    float fr=pow(1.-max(dot(n,v),0.),3.);
    col+=fr*rim*(vec3(.55,.55,1.0)*.9*a + K1*.12*s1);
    if(m==5){ // window on wall
      vec2 w=p.xy-vec2(3.0,2.2); vec2 dw=abs(w)-vec2(1.15,.95); float dd=length(max(dw,0.))+min(max(dw.x,dw.y),0.);
      if(dd<0.){ col=vec3(4.,3.1,1.9)*(1.-.15*abs(sin(w.x*2.7))*step(abs(w.x),.04)*8.); if(abs(w.x)<.035||abs(w.y)<.035) col=vec3(.25,.15,.12); }
      else col+=vec3(1.,.6,.3)*.9*exp(-dd*1.4);
      col+=vec3(.0)+vec3(.9,.5,.8)*0.25*smoothstep(1.,.0,length(p.xy-vec2(-3.,3.)))*0.;
    }
    col=mix(col, vec3(.10,.07,.14), 1.-exp(-t*.006));
  } else col=vec3(.1,.07,.14);
  o=vec4(col,t/40.);
}`;
const FS2=`#version 300 es
precision highp float; in vec2 uv; out vec4 o; uniform sampler2D tx; uniform vec2 res; uniform float focus; uniform float K;
float coc(float tn){return clamp(abs(tn*40.-focus)*K,0.,34.)*res.x/1600.;}
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){
  vec4 c0=texture(tx,uv); float r0=coc(c0.a);
  vec3 acc=vec3(0.); float wsum=0.;
  const int N=48; float ga=2.39996323;
  for(int i=0;i<N;i++){
    float rr=sqrt((float(i)+.5)/float(N)); float an=float(i)*ga;
    vec2 off=rr*vec2(cos(an),sin(an));
    vec2 suv=uv+off*max(r0,1.)/res;
    vec4 s=texture(tx,suv); float rs=coc(s.a);
    float dist=rr*max(r0,1.);
    float w=smoothstep(dist-1.5,dist+.5,rs) ; 
    if(s.a<c0.a-.002) w*=1.; 
    float lum=dot(s.rgb,vec3(.3,.5,.2));
    w*=1.+max(lum-1.5,0.)*2.2*step(2.,rs);   // bokeh highlights
    acc+=s.rgb*w; wsum+=w;
  }
  vec3 col=acc/max(wsum,1e-4);
  col=aces(col*.9);
  col=pow(col,vec3(1./2.2));
  vec2 q=uv-.5; col*=1.-dot(q,q)*.9;
  col+=(hash(uv*res+fract(focus))-.5)*.04;
  o=vec4(col,1.);
}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS)){window.ERR=gl.getShaderInfoLog(x);throw window.ERR}return x}
function pr(f){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);return p}
const P1=pr(FS1),P2=pr(FS2);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
// poses
const POSES={
 stand:{S:[0,-150],Hp:[0,-92],hd:0,L:[[-28,-112],[-32,-74]],R:[[28,-112],[32,-74]],LL:[[-12,-48],[-16,0]],RL:[[12,-48],[16,0]],emo:0},
 run:{S:[26,-146],Hp:[0,-92],hd:12,L:[[0,-112],[-34,-92]],R:[[48,-128],[78,-108]],LL:[[28,-62],[58,-42]],RL:[[-12,-50],[-42,0]],emo:1},
 wow:{S:[0,-150],Hp:[0,-92],hd:-6,L:[[-42,-172],[-54,-218]],R:[[42,-172],[58,-218]],LL:[[-20,-48],[-30,0]],RL:[[20,-48],[30,0]],emo:2}};
const PLACE=[['stand',-1.75,1.1,2.0,[.20,.10,.30]],['run',.35,-.4,1.8,[.38,.10,.12]],['wow',2.3,-2.4,1.65,[.10,.18,.38]]];
const CA=[],CB=[],FIG=[],HEAD=[],HP=[],TC=[];
PLACE.forEach(([k,fx,fz,H,tc])=>{
  const p=POSES[k],u=H/264; const V=(a,y)=>[fx+a*u,-y*u,fz];
  const pt=(a)=>V(a[0],a[1]);
  const S=p.S,Hp=p.Hp;
  const shL=[S[0]-16,S[1]+8],shR=[S[0]+16,S[1]+8], hpL=[Hp[0]-8,Hp[1]],hpR=[Hp[0]+8,Hp[1]];
  const cap=(a,b,r,m)=>{CA.push([...pt(a),r*u]);CB.push([...pt(b),m])};
  cap([Hp[0],Hp[1]],[S[0],S[1]+10],19,2);           //torso
  cap(shL,p.L[0],5.6,3);cap(p.L[0],p.L[1],5.2,3);   //arm L
  cap(shR,p.R[0],5.6,3);cap(p.R[0],p.R[1],5.2,3);   //arm R
  cap(hpL,p.LL[0],7.4,3);cap(p.LL[0],p.LL[1],6.4,3);
  cap(hpR,p.RL[0],7.4,3);cap(p.RL[0],p.RL[1],6.4,3);
  // hands as tiny capsules at wrists (L,R)... and feet: use one cap each end
  cap(p.L[1],[p.L[1][0]-1,p.L[1][1]+3],7.6,4);cap(p.R[1],[p.R[1][0]+1,p.R[1][1]+3],7.6,4);
  FIG.push([...V((0+ (S[0]))/2,(-90-0)/1* -1*0 + (S[1]+0)/2*1),0]); // placeholder replaced below
  const cx=fx, cy=H*.48, R=H*.62; FIG[FIG.length-1]=[cx+ (S[0]*u)*.4, cy, fz, R];
  const hx=S[0]+p.hd*.4, hy=S[1]-62;
  HEAD.push([...V(hx,hy),-p.hd*Math.PI/180]); HP.push([H/264*100,p.emo,0,0]); TC.push(...tc);
});
// feet handled as extra capsule pair: append 2 feet caps per fig (we have 9 caps +2 hands =11 -> feet omitted; shoes as part of leg ends)
while(CA.length<40){CA.push([0,-9,0,0]);CB.push([0,-9,0,0]);}
function U(p,n,v,f){const l=gl.getUniformLocation(p,n);f(l,v)}
function pass(){
  const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  const fmt=ext?gl.RGBA16F:gl.RGBA8, ty=ext?gl.HALF_FLOAT:gl.UNSIGNED_BYTE;
  gl.texImage2D(gl.TEXTURE_2D,0,fmt,Wd,Ht,0,gl.RGBA,ty,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  gl.viewport(0,0,Wd,Ht);gl.useProgram(P1);
  gl.uniform2f(gl.getUniformLocation(P1,'res'),Wd,Ht);
  gl.uniform4fv(gl.getUniformLocation(P1,'CA'),CA.flat());gl.uniform4fv(gl.getUniformLocation(P1,'CB'),CB.flat());
  gl.uniform4fv(gl.getUniformLocation(P1,'FIG'),FIG.flat());gl.uniform4fv(gl.getUniformLocation(P1,'HEAD'),HEAD.flat());gl.uniform4fv(gl.getUniformLocation(P1,'HP'),HP.flat());gl.uniform3fv(gl.getUniformLocation(P1,'TC'),TC);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.finish();
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,Wd,Ht);gl.useProgram(P2);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(gl.getUniformLocation(P2,'tx'),0);
  gl.uniform2f(gl.getUniformLocation(P2,'res'),Wd,Ht);gl.uniform1f(gl.getUniformLocation(P2,'focus'),6.4);gl.uniform1f(gl.getUniformLocation(P2,'K'),3.6);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.finish();window.DONE=true;
}
setTimeout(pass,50);
